name: Secrets & Environment Variables Check

on:
  workflow_dispatch:
    inputs:
      env_name:
        description: "Environment to inspect"
        required: true
        default: "DEV"
        type: choice
        options:
          - DEV
          - QA
          - PROD

jobs:
  verify_secrets:
    name: Verify Secrets (${{ inputs.env_name }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_name }}
    steps:
      - name: Check environment variables and secret presence
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          echo "Host configured: ${DATABRICKS_HOST:-<not set>}"
          echo "Client ID configured: ${DATABRICKS_CLIENT_ID:-<not set>}"
          if [ -n "$DATABRICKS_CLIENT_SECRET" ]; then
            echo "DATABRICKS_CLIENT_SECRET is present (masked automatically by GitHub)."
          else
            echo "DATABRICKS_CLIENT_SECRET is not set yet."
          fi
