name: Multi-Environment Deployment

on:
  push:
    branches:
      - develop
      - qa
      - main
  workflow_dispatch:

jobs:
  deploy_dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load DEV configuration & deploy
        env:
          TARGET_ENV: ${{ vars.TARGET_ENV || 'dev' }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
        run: |
          echo "Deploying Databricks application to DEV..."
          cat config/env_dev.json
          echo "DEV deployment completed."

  deploy_qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: deploy_dev
    environment: QA
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load QA configuration & deploy
        env:
          TARGET_ENV: ${{ vars.TARGET_ENV || 'qa' }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
        run: |
          echo "DEV succeeded. Deploying Databricks application to QA..."
          cat config/env_qa.json
          echo "QA deployment completed."

  deploy_prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: deploy_qa
    environment: PROD
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load PROD configuration & deploy
        env:
          TARGET_ENV: ${{ vars.TARGET_ENV || 'prod' }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
        run: |
          echo "QA succeeded. Ready for PROD deployment after approval..."
          cat config/env_prod.json
          echo "PROD deployment completed."
